<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebToAgent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1 class="title">WebToAgent</h1>

    <div class="section">
      <div class="status-row">
        <span class="label" data-i18n="connectionStatus">Connection status</span>
        <span class="status-badge" id="status-badge" data-i18n="checking">Checking...</span>
      </div>
      <p class="hint" id="status-hint"></p>
    </div>

    <div class="section">
      <label class="label" data-i18n="supportedSites">Supported sites</label>
      <div class="site-list">
        <label class="site-item">
          <input type="checkbox" data-site="chat.qwen.ai" checked />
          <span data-i18n="qwenSite">Qwen (chat.qwen.ai)</span>
        </label>
        <label class="site-item">
          <input type="checkbox" data-site="chatgpt.com" checked />
          <span>ChatGPT (chatgpt.com)</span>
        </label>
        <label class="site-item">
          <input type="checkbox" data-site="aistudio.google.com" checked />
          <span>Google AI Studio (aistudio.google.com)</span>
        </label>
        <label class="site-item">
          <input type="checkbox" data-site="gemini.google.com" checked />
          <span>Gemini (gemini.google.com)</span>
        </label>
        <label class="site-item">
          <input type="checkbox" data-site="claude.ai" checked />
          <span>Claude (claude.ai)</span>
        </label>
      </div>
    </div>

    <div class="section">
      <p class="hint" data-i18n-html="openPanelHint">Open a supported site, then click 📁 in the bottom-right corner or press <kbd>Ctrl+Shift+F</kbd> to open the file panel.</p>
    </div>

    <div class="section footer">
      <span class="version">v0.1.0</span>
      <a href="#" id="help-link" data-i18n="help">Help</a>
    </div>
  </div>

  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
